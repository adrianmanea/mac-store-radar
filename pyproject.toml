[project]
name = "mac-app-radar"
version = "0.1.0"
description = "Scans the Mac App Store for under-served niches with proven demand and weak incumbents, and scores each."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "supabase>=2.7",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
]

[project.scripts]
radar = "radar.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
radar = ["weights.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP017 rewrites datetime.timezone.utc -> datetime.UTC (a 3.11+ runtime name). We keep
# timezone.utc so the code still runs on a 3.9 dev interpreter; annotations stay modern
# via `from __future__ import annotations`. Project still officially targets 3.11+.
ignore = ["UP017"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
