name: daily-scrape

on:
  schedule:
    # 06:00 UTC daily. Actions cron is best-effort (can lag minutes under load) —
    # fine for a daily momentum snapshot (TECH-PRD §8).
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed the default 20-niche calibration set before scraping'
        type: boolean
        default: false
      limit:
        description: 'Max apps per niche search'
        default: '200'

# One run at a time; a long run must never overlap the next day's trigger.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # well under the 6h job cap; daily run targets <1h
    # Job-level so the LLM step's `if:` can test whether the key secret is set.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - name: Run scrape + score
        run: |
          if [ "${{ inputs.seed }}" = "true" ]; then
            python -m radar --seed --limit "${{ inputs.limit || 200 }}"
          else
            python -m radar --limit "${{ inputs.limit || 200 }}"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RADAR_STOREFRONT: us

      # Decoupled LLM job (M6): never blocks the scrape above. Runs only when the key
      # secret is set, and tolerates failure so a bad LLM run doesn't fail the snapshot.
      - name: Tag buildability (LLM)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        continue-on-error: true
        run: python -m radar --tag 60
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Discovery (M9): Google Suggest (free, no key) proposes niches — plus Claude if the
      # key is set — validate+score, auto-promote winners so tomorrow's scrape tracks them.
      # Runs unconditionally (Google needs no key); decoupled so it never blocks the scrape.
      - name: Discover niches
        continue-on-error: true
        run: python -m radar --discover
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
